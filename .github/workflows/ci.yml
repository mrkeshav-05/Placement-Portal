name: CI
on:
  pull_request:
  push: { branches: [main, develop] }

jobs:
  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/tnp_portal"
      AUTH_SECRET: "ci-only-secret"
      ADMIN_EMAILS: ""
      STUDENT_EMAIL_DOMAIN: "iiitl.ac.in"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run db:generate
      - run: npm run lint
      - run: npm run type-check
      - run: npm test
      - run: npm run build

  backend:
    name: Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - name: Import check
        run: python -c "import main"
      - run: pytest

  images:
    name: Docker images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build backend image
        run: docker build -t tnp-backend ./backend
      - name: Build migration image
        run: docker build -t tnp-migrate -f database/Dockerfile .
      - name: Build frontend image
        run: docker build -t tnp-frontend -f frontend/Dockerfile .
